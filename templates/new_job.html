{% extends "base.html" %}
{% block title %}New job — LateBump{% endblock %}
{% block content %}
<div class="page-head">
  <p class="crumb"><a href="{{ url_for('index') }}">Jobs</a> / New</p>
  <h1>New job</h1>
  <p class="lede">Minimal fields. Phone for SMS, email for SMTP — copy always works.</p>
</div>

{% if errors %}
<ul class="flashes">
  {% for e in errors %}<li class="flash flash-error">{{ e }}</li>{% endfor %}
</ul>
{% endif %}

<section class="card">
  <form method="post" class="stack">
    <label>Customer name *
      <input name="customer_name" required value="{{ (form.customer_name if form else '') }}">
    </label>
    <label>Customer phone
      <input name="customer_phone" type="tel" value="{{ (form.customer_phone if form else '') }}" placeholder="+15551234567">
    </label>
    <label>Customer email
      <input name="customer_email" type="email" value="{{ (form.customer_email if form else '') }}">
    </label>
    <label>Title
      <input name="title" value="{{ (form.title if form else '') }}" placeholder="Furnace tune-up">
    </label>
    <label>Job ref
      <input name="job_ref" value="{{ (form.job_ref if form else '') }}">
    </label>
    <label>Scheduled window / ETA
      <input name="scheduled_window" value="{{ (form.scheduled_window if form else '') }}" placeholder="1–3pm">
    </label>
    <label>Site label
      <input name="site_label" value="{{ (form.site_label if form else '') }}" placeholder="123 Oak St">
    </label>
    <label>Notes (internal)
      <textarea name="notes" rows="3">{{ (form.notes if form else '') }}</textarea>
    </label>
    <div class="btn-row">
      <button type="submit" class="btn">Create job</button>
      <a class="btn btn-quiet" href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
