{% extends "base.html" %}
{% block title %}Log in — LateBump{% endblock %}
{% block content %}
<section class="card login-card">
  <div class="page-head">
    <h1>Owner login</h1>
    <p class="lede">Enter the owner password to manage jobs and delay pings.</p>
  </div>
  {% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}
  <form method="post" class="stack" action="{{ url_for('login') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Password
      <input type="password" name="password" required autofocus autocomplete="current-password">
    </label>
    <button type="submit" class="btn">Log in</button>
  </form>
</section>
{% endblock %}
